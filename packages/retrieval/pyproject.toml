[project]
name = "mylife-retrieval"
version = "0.1.0"
description = "mylife 检索：jieba 分词、RRF 融合、snippet"
requires-python = ">=3.12"
dependencies = ["jieba>=0.42.1,<1", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mylife_retrieval"]
