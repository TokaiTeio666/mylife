# review-profile.yml — 复盘领域契约（ARCHITECTURE §16.3）
#
# 本文件只是 docs/ARCHITECTURE.md §5.1 的镜像，**不是语义源**。
# 启动时 `mylife_agent.profile.validate_review_profile()` 按 kind 逐项校验；
# 任一项与 packages/contracts/mylife_contract/constants.py 不一致即拒绝启动。

sections:
  daily:
    - section_key: today_tasks
      ordinal: 1
      title: 今日待办
      required_fields: [completed, open, carried_over]
      sentinel: 今日待办：无记录
      max_evidence: 12
    - section_key: learning_summary
      ordinal: 2
      title: 学习内容摘要
      required_fields: [topic, concept_or_method, output, open_questions]
      sentinel: 学习内容摘要：本日无学习内容记录
      max_evidence: 12
    - section_key: journal_events
      ordinal: 3
      title: 日记事件摘要
      required_fields: [event, person, decision, emotion, result]
      sentinel: 日记事件摘要：本日无日记事件记录
      max_evidence: 12
    - section_key: mistakes
      ordinal: 4
      title: 做错的事
      required_fields: [event, root_cause, cost, correct_action, recurrence_trigger]
      sentinel: 做错的事：本日无明显错误记录
      max_evidence: 12
    - section_key: methods
      ordinal: 5
      title: 正确方法论
      required_fields:
        [name, source, applicable_scenario, steps, boundaries, landing_action, verification_criteria]
      sentinel: 正确方法论：本日无新增方法论记录
      max_evidence: 12
    - section_key: tomorrow_actions
      ordinal: 6
      title: 明日行动
      required_fields: [text, trigger, verification]
      sentinel: 明日行动：无（未找到可执行依据）
      max_evidence: 12
    - section_key: one_line_summary
      ordinal: 7
      title: 一句话总结
      required_fields: [summary]
      sentinel: 一句话总结：本日无可总结内容
      max_evidence: 1
  weekly:
    - section_key: completion_rate
      ordinal: 1
      title: 任务完成率
      required_fields: [completed, total, rate, ledger_recalc]
      sentinel: 本周完成率：无记录
      max_evidence: 12
    - section_key: recurring_mistakes
      ordinal: 2
      title: 重复错误
      required_fields: [canonical_key, top_n, occurrences, first_seen, last_seen]
      sentinel: 重复错误：本周无记录
      max_evidence: 12
    - section_key: method_landing
      ordinal: 3
      title: 方法论落地
      required_fields: [method, action_count, verification_status]
      sentinel: 方法论落地：本周无记录
      max_evidence: 12
    - section_key: next_week_actions
      ordinal: 4
      title: 下周行动
      required_fields: [text, trigger, verification]
      sentinel: 下周行动：无（未找到可执行依据）
      max_evidence: 12
  yearly:
    - section_key: learning_map
      ordinal: 1
      title: 年度学习地图
      required_fields: [topics, concepts, outputs, related_weeks]
      sentinel: 年度学习地图：本年无记录
      max_evidence: 20
    - section_key: event_timeline
      ordinal: 2
      title: 事件线
      required_fields: [date, event, result]
      sentinel: 事件线：本年无记录
      max_evidence: 20
    - section_key: top_mistakes
      ordinal: 3
      title: 错误 Top10
      required_fields: [rank, item, occurrences, cost, source]
      sentinel: 错误 Top10：本年无记录
      max_evidence: 20
    - section_key: method_system
      ordinal: 4
      title: 方法论体系
      required_fields: [category, name, scenario, verification]
      sentinel: 方法论体系：本年无记录
      max_evidence: 20
    - section_key: next_year_direction
      ordinal: 5
      title: 下一年方向
      required_fields: [direction, basis, first_action]
      sentinel: 下一年方向：本年无记录
      max_evidence: 10

record_types: [error, method, action]

write_modes:
  每日复盘: update_allowed
  每周复盘: update_allowed
  年度复盘: update_allowed
  专题: append_only

sentinels:
  today_tasks: 今日待办：无记录
  learning_summary: 学习内容摘要：本日无学习内容记录
  journal_events: 日记事件摘要：本日无日记事件记录
  mistakes: 做错的事：本日无明显错误记录
  methods: 正确方法论：本日无新增方法论记录
  tomorrow_actions: 明日行动：无（未找到可执行依据）
  one_line_summary: 一句话总结：本日无可总结内容
  completion_rate: 本周完成率：无记录
  recurring_mistakes: 重复错误：本周无记录
  method_landing: 方法论落地：本周无记录
  next_week_actions: 下周行动：无（未找到可执行依据）
  learning_map: 年度学习地图：本年无记录
  event_timeline: 事件线：本年无记录
  top_mistakes: 错误 Top10：本年无记录
  method_system: 方法论体系：本年无记录
  next_year_direction: 下一年方向：本年无记录

context_rules:
  global_max_evidence: 80
  section_max_evidence: 12
  yearly_section_max_evidence: 20
  correlation_targets:
    - PRIOR_REVIEW
    - TOPIC_PAGE
    - WIKILINK_NEIGHBORHOOD
    - TAG_COHORT
    - RECURRING_ERROR
    - RECURRING_METHOD
    - TASK_CARRY
    - STATS_BASELINE
