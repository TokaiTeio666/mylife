[project]
name = "mylife-agent"
version = "0.1.0"
description = "mylife Agent：chat 提供方、提示词、注入检测、引用闭包（纯逻辑，无 IO/DB）"
requires-python = ">=3.12"
dependencies = [
  "mylife-contract",
  "mylife-runtime",
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mylife-contract = { workspace = true }
mylife-runtime = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["mylife_agent"]

[tool.hatch.build.targets.wheel.force-include]
"review-profile.yml" = "mylife_agent/review-profile.yml"
