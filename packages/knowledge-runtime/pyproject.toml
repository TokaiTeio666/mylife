[project]
name = "mylife-runtime"
version = "0.1.0"
description = "mylife 知识运行时：路径校验、原子写、来源注册"
requires-python = ">=3.12"
dependencies = ["cryptography>=43,<47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mylife_runtime"]
