[project]
name = "mylife-api"
version = "0.1.0"
description = "mylife FastAPI 服务（Phase 0：auth / workspace / RunContext / RLS）"
requires-python = ">=3.12"
dependencies = [
  "mylife-contract",
  "mylife-runtime",
  "mylife-retrieval",
  "mylife-agent",
  "mylife-delivery",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
  "redis>=5.2,<7",
  "python-multipart>=0.0.12,<1",
  "aiofiles>=24,<26",
  "markdown-it-py>=3,<4",
  "nh3>=0.2.18,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.28,<1",
  "ruff>=0.8,<1",
]

[tool.uv.sources]
mylife-contract = { workspace = true }
mylife-runtime = { workspace = true }
mylife-retrieval = { workspace = true }
mylife-agent = { workspace = true }
mylife-delivery = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mylife_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "db: 需要 PostgreSQL 的集成测试",
  "contract: 契约/OpenAPI 测试",
  "fixture: golden fixture（ACCEPTANCE-CRITERIA §4）",
]
filterwarnings = ["error::DeprecationWarning:mylife_api.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]
