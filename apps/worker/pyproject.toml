[project]
name = "mylife-worker"
version = "0.1.0"
description = "mylife Celery worker：ingest / embed"
requires-python = ">=3.12"
dependencies = [
  "mylife-contract",
  "mylife-runtime",
  "mylife-retrieval",
  "mylife-agent",
  "celery[redis]>=5.4,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "markdown-it-py>=3,<4",
  "nh3>=0.2.18,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.uv.sources]
mylife-contract = { workspace = true }
mylife-runtime = { workspace = true }
mylife-retrieval = { workspace = true }
mylife-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mylife_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]
